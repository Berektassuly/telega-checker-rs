# ═══════════════════════════════════════════════════════════════════════════════
# Rate Limiting Zone
# ═══════════════════════════════════════════════════════════════════════════════
# Limit /api/ requests to 20 per second per client IP.
# Uses CF-Connecting-IP (real client IP behind Cloudflare proxy).
# 10m zone = ~160,000 unique IPs tracked simultaneously.
limit_req_zone $http_cf_connecting_ip zone=api_limit:10m rate=20r/s;

# ═══════════════════════════════════════════════════════════════════════════════
# Upstream: Rust Backend (Dual-Core)
# ═══════════════════════════════════════════════════════════════════════════════
upstream backend {
    server bot:8080;
}

# ═══════════════════════════════════════════════════════════════════════════════
# HTTP → HTTPS Redirect
# ═══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name checker.berektassuly.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ═══════════════════════════════════════════════════════════════════════════════
# HTTPS Server — Cloudflare Origin Certificate (Full Strict)
# Cloudflare terminates the public SSL and re-encrypts to this server
# using the Origin Certificate (trusted only by Cloudflare).
# ═══════════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    server_name checker.berektassuly.com;

    # ── Cloudflare Origin Certificate ──
    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;

    # ── Modern SSL settings ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── API Endpoint — Rate Limited ──
    location /api/ {
        # Allow burst of 10 requests, excess are rejected with 429
        limit_req zone=api_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;

        # Standard reverse proxy headers
        # Use CF-Connecting-IP as the real client IP (Cloudflare passes this)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # ── Deny all other paths ──
    location / {
        return 404;
    }
}
