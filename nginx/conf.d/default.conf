# ═══════════════════════════════════════════════════════════════════════════════
# Rate Limiting Zone
# ═══════════════════════════════════════════════════════════════════════════════
# Limit /api/ requests to 20 per second per client IP.
# Uses CF-Connecting-IP (real client IP behind Cloudflare proxy).
# 10m zone = ~160,000 unique IPs tracked simultaneously.
limit_req_zone $http_cf_connecting_ip zone=api_limit:10m rate=20r/s;

# ═══════════════════════════════════════════════════════════════════════════════
# Upstream: Rust Backend (Dual-Core)
# ═══════════════════════════════════════════════════════════════════════════════
upstream backend {
    server bot:8080;
}

# ═══════════════════════════════════════════════════════════════════════════════
# HTTP Server — Reverse Proxy to Rust Backend
# SSL is terminated by Cloudflare; this server only handles plain HTTP.
# ═══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name checker.berektassuly.com;

    # ── API Endpoint — Rate Limited ──
    location /api/ {
        # Allow burst of 10 requests, excess are rejected with 429
        limit_req zone=api_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;

        # Standard reverse proxy headers
        # Use CF-Connecting-IP as the real client IP (Cloudflare passes this)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # ── Deny all other paths ──
    location / {
        return 404;
    }
}
