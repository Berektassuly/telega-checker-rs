# ═══════════════════════════════════════════════════════════════════════════════
# Rate Limiting Zone
# ═══════════════════════════════════════════════════════════════════════════════
# Limit /api/ requests to 5 per second per client IP.
# 10m zone = ~160,000 unique IPs tracked simultaneously.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

# ═══════════════════════════════════════════════════════════════════════════════
# Upstream: Rust Backend (Dual-Core)
# ═══════════════════════════════════════════════════════════════════════════════
upstream backend {
    server bot:8080;
}

# ═══════════════════════════════════════════════════════════════════════════════
# HTTP → HTTPS Redirect + ACME Challenge
# ═══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge (Certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ═══════════════════════════════════════════════════════════════════════════════
# HTTPS Server — Reverse Proxy to Rust Backend
# ═══════════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    server_name _;

    # ── SSL Certificates (Let's Encrypt via Certbot) ──
    # IMPORTANT: Replace 'yourdomain.com' with your actual domain name
    # after running certbot for the first time.
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # ── Modern SSL settings ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── API Endpoint — Rate Limited ──
    location /api/ {
        # Allow burst of 10 requests, delay excess (don't reject immediately)
        limit_req zone=api_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;

        # Standard reverse proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # ── Deny all other paths ──
    location / {
        return 404;
    }
}
