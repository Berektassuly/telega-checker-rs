[package]
name = "telega-checker-rs"
version = "0.1.0"
edition = "2024"
description = "High-performance Telegram bot that checks if a user ID exists in Telega's call infrastructure"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Telegram bot framework (latest)
teloxide = { version = "0.17", features = ["macros"] }

# HTTP client — .form() is an opt-in feature in 0.13+
reqwest = { version = "0.13", features = ["native-tls", "form"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite via async pool
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# High-performance async in-memory cache (LRU + TTL)
moka = { version = "0.12", features = ["future"] }

# Environment variable loading
dotenvy = "0.15"

# Error handling
anyhow = "1"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
