services:
  # ── Rust Backend (Dual-Core: Telegram Bot + HTTP API) ──
  bot:
    build: .
    env_file: .env
    environment:
      # Override DATABASE_URL to point to the persistent volume path
      DATABASE_URL: "sqlite:/app/data/telega_checker.db?mode=rwc"
    volumes:
      - bot_data:/app/data
    # No port mapping to host — only exposed to the internal Docker network.
    # Cloudflare Tunnel proxies external traffic to bot:8080.
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - internal

  # ── Cloudflare Tunnel (Secure outbound connection to Cloudflare) ──
  cloudflared:
    image: cloudflare/cloudflared:latest
    # Run the tunnel using the token provided in .env
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - bot
    restart: unless-stopped
    networks:
      - internal

volumes:
  bot_data:

networks:
  internal:
    driver: bridge
