services:
  # ── Rust Backend (Dual-Core: Telegram Bot + HTTP API) ──
  bot:
    build: .
    env_file: .env
    environment:
      # Override DATABASE_URL to point to the persistent volume path
      DATABASE_URL: "sqlite:/app/data/telega_checker.db?mode=rwc"
    volumes:
      - bot_data:/app/data
    # No port mapping to host — only exposed to the internal Docker network.
    # Nginx proxies external traffic to bot:8080.
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - internal

  # ── Nginx Reverse Proxy (SSL via Cloudflare Origin Cert + rate limiting) ──
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - bot
    restart: unless-stopped
    networks:
      - internal

volumes:
  bot_data:

networks:
  internal:
    driver: bridge
